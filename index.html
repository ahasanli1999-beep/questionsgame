<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question Game</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #20253a; background: linear-gradient(135deg, #f0f4ff, #e6f7f3); }
    main { width: min(100%, 560px); background: white; padding: 32px; border-radius: 20px; box-shadow: 0 18px 50px #24345a20; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    .intro, .muted { color: #65708a; }
    label { display: block; margin: 18px 0 7px; font-weight: 650; }
    input[type="text"] { width: 100%; padding: 12px 14px; font: inherit; border: 1px solid #ccd3e0; border-radius: 10px; }
    input:focus { outline: 3px solid #c8d5ff; border-color: #657ff0; }
    .choices { display: flex; gap: 12px; margin-top: 10px; }
    .choices label { display: flex; align-items: center; gap: 7px; margin: 0; padding: 10px 14px; border: 1px solid #d9deea; border-radius: 10px; cursor: pointer; }
    button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 10px; background: #5268dc; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #3f54c5; }
    .message { margin-top: 20px; line-height: 1.65; }
    .error { color: #b42318; margin: 12px 0 0; }
    .hidden { display: none; }
    @media (max-width: 480px) { main { padding: 24px; } }
  </style>
</head>
<body>
  <main>
    <h1>🎮 Question Game</h1>
    <p class="intro">Answer a few questions, then choose your path through the story!</p>
    <form id="gameForm">
      <section id="questions"></section>
      <p id="error" class="error" role="alert"></p>
      <button id="submitButton" type="submit">Continue</button>
    </form>
    <div id="result" class="message" aria-live="polite"></div>
  </main>
<script>
  const form = document.getElementById('gameForm');
  const questions = document.getElementById('questions');
  const result = document.getElementById('result');
  const error = document.getElementById('error');
  const submitButton = document.getElementById('submitButton');
  const answers = {};
  let step = 0;

  function textQuestion(id, prompt) {
    return `<label for="${id}">${prompt}</label><input id="${id}" name="${id}" type="text" autocomplete="off">`;
  }
  function yesNo(id, prompt) {
    return `<label>${prompt}</label><div class="choices"><label><input type="radio" name="${id}" value="yes" required> Yes</label><label><input type="radio" name="${id}" value="no" required> No</label></div>`;
  }
  function showStep() {
    error.textContent = '';
    result.textContent = '';
    form.classList.remove('hidden');
    if (step === 0) {
      questions.innerHTML = textQuestion('name', 'What is your name?') + textQuestion('age', 'How old are you?') + textQuestion('hobby', 'What is your hobby?') + textQuestion('job', 'What is your job?');
      submitButton.textContent = 'Continue';
    } else if (step === 1) {
      questions.innerHTML = yesNo('continue', 'Do you want to continue?') + textQuestion('place', 'Where do you live?') + yesNo('city', 'Do you like your city?') + yesNo('alone', 'Do you like being alone?') + yesNo('games', 'Do you like playing games?');
      submitButton.textContent = 'Next';
    } else if (step === 2) {
      questions.innerHTML = yesNo('play', 'Would you like to play a game?');
      submitButton.textContent = 'Choose';
    } else if (step === 3) {
      questions.innerHTML = '<p>You are in a dark forest. The left path leads deeper into the forest; the right path leads to a village.</p>' + `<label for="path">Which path do you choose?</label><select id="path" name="path" required style="width:100%;padding:12px;font:inherit;border:1px solid #ccd3e0;border-radius:10px"><option value="">Choose a path</option><option value="left">Left — forest</option><option value="right">Right — village</option></select>`;
      submitButton.textContent = 'Go!';
    } else {
      finish();
    }
  }
  function collect() {
    for (const [key, value] of new FormData(form).entries()) answers[key] = value.trim();
  }
  function finish() {
    form.classList.add('hidden');
    const name = answers.name || 'friend';
    const place = answers.place || 'there';
    let story = `<p><strong>Hi, ${escapeHtml(name)}!</strong></p><p>You are ${escapeHtml(answers.age)} years old. Great! That's a great hobby, ${escapeHtml(name)}! You are a ${escapeHtml(answers.job)} and ${escapeHtml(answers.age)} years old. That's impressive!</p>`;
    story += `<p>You live in ${escapeHtml(place)}, and ${escapeHtml(place)} is a wonderful place! ${place.toLowerCase() === 'baku' ? 'Baku is a beautiful city! ' : ''}${answers.city === 'yes' ? 'That’s great to hear!' : 'I understand.'}</p>`;
    story += `<p>${answers.alone === 'yes' ? 'Being alone can be peaceful and refreshing.' : 'It’s nice to have company sometimes.'} ${answers.games === 'yes' ? 'Playing games can be a lot of fun!' : 'That’s okay, everyone has different interests.'}</p>`;
    if (answers.play === 'no') story += '<p>No problem! Maybe next time.</p>';
    else if (answers.path === 'left') story += '<p>🌲 You walk into the forest and find a treasure chest! You win! 🏆</p>';
    else story += '<p>🏡 You walk to the village and find a friendly villager who gives you a map. You win! 🗺️</p>';
    result.innerHTML = story;
    const again = document.createElement('button');
    again.type = 'button'; again.textContent = 'Play again'; again.onclick = () => { for (const key of Object.keys(answers)) delete answers[key]; step = 0; form.reset(); showStep(); };
    result.appendChild(again);
  }
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }
  form.addEventListener('submit', event => {
    event.preventDefault();
    error.textContent = '';
    collect();
    if (step === 0 && !answers.name) { error.textContent = 'Please enter your name to continue.'; return; }
    step++;
    showStep();
  });
  showStep();
</script>
</body>
</html>
